name: Android

# Construit l'application Android à partir des sources : les trois éditeurs
# sont compilés, copiés dans l'application, puis quatre paquets sont produits
# (x86, armeabi-v7a, arm64-v8a et universel). Chacun est vérifié — signature,
# alignement, architectures contenues, empreinte — avant d'être publié.
on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - 'src/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version publiée (ex. 1.0.0)'
        required: false
        default: '1.0.0'
      versionCode:
        description: 'Numéro de version Android (entier croissant)'
        required: false
        default: '1'
      publish:
        description: 'Publier dans les versions GitHub'
        type: boolean
        required: false
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  VERSION_NAME: ${{ github.event.inputs.versionName || '1.0.0' }}
  VERSION_CODE: ${{ github.event.inputs.versionCode || '1' }}

jobs:
  build:
    name: Paquets signés
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installer les outils de compilation
        run: |
          set -euo pipefail
          for app in documents spreadsheet presentation nemesis-workspace; do
            echo "── src/$app"
            (cd "src/$app" && npm ci --no-audit --no-fund --include=dev)
          done

      - name: Compiler les trois éditeurs et l'accueil
        run: |
          set -euo pipefail
          node --version
          cd src/nemesis-workspace
          # Le journal complet reste lisible même si l'étape échoue.
          set -o pipefail
          export NPM_CONFIG_PRODUCTION=false
          export NPM_CONFIG_OMIT=""
          node dev/build-all.mjs 2>&1 | tee /tmp/android-build.log
          # Rien ne doit être servi depuis le réseau : l'interface doit
          # exister, en entier, avant d'entrer dans l'application.
          test -f ../nemesis-workspace/dist/index.html
          test -f ../nemesis-workspace/dist/documents/index.html
          test -f ../nemesis-workspace/dist/spreadsheet/index.html
          test -f ../nemesis-workspace/dist/presentation/index.html
          du -sh ../nemesis-workspace/dist

      - name: Embarquer l'interface dans l'application
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R src/nemesis-workspace/dist/. android/app/src/main/assets/www/
          test -f android/app/src/main/assets/www/index.html
          # Aucune référence à une origine distante ne doit subsister.
          if grep -rlE 'https?://(localhost|127\.0\.0\.1):(4200|4310|5173)' android/app/src/main/assets/www; then
            echo "::error::L'interface embarque une adresse de développement."
            exit 1
          fi
          du -sh android/app/src/main/assets/www

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Vérifier la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android

          # Le mot de passe ne doit jamais apparaître dans les journaux.
          [ -z "${KEYSTORE_PASSWORD:-}" ] || echo "::add-mask::$KEYSTORE_PASSWORD"
          [ -z "${KEY_PASSWORD:-}" ] || echo "::add-mask::$KEY_PASSWORD"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            # Une clé fournie par la forge — rotation, ou dépôt sans clé.
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/nemesis-release.p12
            {
              echo "storeFile=keystore/nemesis-release.p12"
              echo "storePassword=${KEYSTORE_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS:-nemesisworkspace}"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > keystore.properties
            chmod 600 keystore.properties
            echo "::notice::Clé fournie par les secrets du dépôt."
          elif [ -f keystore/nemesis-release.p12 ] && [ -s keystore/nemesis-release.pass ]; then
            echo "::notice::Clé de publication du dépôt utilisée."
          else
            echo "::error::Aucune clé de signature : keystore/nemesis-release.p12 est absent."
            exit 1
          fi

      - name: Construire les quatre paquets
        shell: bash
        run: |
          set -uo pipefail
          cd android
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace \
            -Pnemesis.versionName="${VERSION_NAME}" \
            -Pnemesis.versionCode="${VERSION_CODE}" \
            assembleRelease 2>&1 | tee -a /tmp/android-build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ] && [ -f app/build/reports/lint-results-release.txt ]; then
            # Le détail de lint, s'il a arrêté la construction.
            head -80 app/build/reports/lint-results-release.txt | tee -a /tmp/android-build.log
          fi
          echo "─ Paquets produits :"
          find app/build/outputs -name '*.apk' -printf '%p  %k Ko\n' 2>/dev/null | sort || true
          exit "$STATUS"

      - name: Vérifier chaque paquet
        shell: bash
        run: |
          exec > >(tee /tmp/verify.log) 2>&1
          set -uo pipefail
          fail() { echo "::error::$*"; exit 1; }

          APKS=$(find android/app/build/outputs/apk/release -name '*.apk' | sort)
          [ -n "$APKS" ] || fail "Aucun paquet produit."
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Outils de construction : $BUILD_TOOLS"
          rm -rf verification && mkdir -p verification

          for apk in $APKS; do
            name=$(basename "$apk" .apk)
            echo "── $name"
            # 1. Signature valide, couvrant tout le paquet.
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk" > "verification/$name.signature.txt" 2>&1 \
              || fail "$name : signature invalide"
            sed -n '1,6p' "verification/$name.signature.txt"
            grep -q '^Verifies' "verification/$name.signature.txt" || fail "$name : signature non vérifiée"
            # 2. Alignement 4 octets (16 pour les pages de 16 Ko).
            "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$apk" > "verification/$name.align.txt" 2>&1 \
              || fail "$name : paquet mal aligné"
            tail -n 1 "verification/$name.align.txt"
            # 3. Architectures réellement embarquées.
            unzip -l "$apk" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u > "verification/$name.abis.txt" || true
            echo "   architectures : $(tr '\n' ' ' < "verification/$name.abis.txt")"
            # 4. L'interface est embarquée, en entier.
            unzip -l "$apk" | grep -q 'assets/www/index.html' || fail "$name : interface absente"
            unzip -l "$apk" | grep -q 'assets/www/documents/index.html' || fail "$name : éditeur de documents absent"
            unzip -l "$apk" | grep -q 'assets/www/spreadsheet/index.html' || fail "$name : tableur absent"
            unzip -l "$apk" | grep -q 'assets/www/presentation/index.html' || fail "$name : présentations absentes"
            # 5. Empreinte et taille, publiées avec les paquets.
            sha256sum "$apk" | tee "verification/$name.sha256"
            stat -c '%s' "$apk" > "verification/$name.size"
          done

          # 6. Ce que le runner a réellement produit, avant contrôle.
          find android/app/build/outputs/apk/release -name '*.apk' -printf '%f\n' | sort

          # 7. Un seul paquet, et il doit contenir les trois éditeurs.
          count=$(find android/app/build/outputs/apk/release -name '*.apk' | wc -l)
          [ "$count" -eq 1 ] || fail "un seul paquet est publié, $count ont été produits"
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          "$BUILD_TOOLS/aapt2" dump badging "$apk" > verification/badging.txt 2>&1 \
            || fail "le manifeste du paquet est illisible"
          grep -E "^(package|sdkVersion|targetSdkVersion|native-code|launchable-activity)" verification/badging.txt
          grep -q "launchable-activity" verification/badging.txt || fail "aucun point d'entrée"
          # Aucun code natif : le paquet est le même partout.
          if grep -q "native-code" verification/badging.txt; then
            echo "::warning::du code natif est apparu ; les architectures redeviennent une contrainte"
          fi
          echo "::notice::Vérifications terminées : signature, alignement, manifeste, interface."

      - name: Installer et lancer sur un émulateur x86
        shell: bash
        timeout-minutes: 25
        if: always() && hashFiles('android/app/build/outputs/apk/release/*.apk') != ''
        run: |
          exec > >(tee -a /tmp/emulator.log) 2>&1
          set -uo pipefail
          fail() { echo "::error::$*"; exit 1; }

          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build >/dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "emulator" "platform-tools" "system-images;android-30;google_apis;x86" >/dev/null

          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Paquet testé : $APK"

          # Un appareil de bureau : 1600×1200, clavier et souris.
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n nemesis -k "system-images;android-30;google_apis;x86" --force >/dev/null
          echo 'hw.keyboard=yes' >> "$HOME/.android/avd/nemesis.avd/config.ini"
          echo 'hw.lcd.width=1600' >> "$HOME/.android/avd/nemesis.avd/config.ini"
          echo 'hw.lcd.height=1200' >> "$HOME/.android/avd/nemesis.avd/config.ini"
          echo 'hw.lcd.density=160' >> "$HOME/.android/avd/nemesis.avd/config.ini"

          "$ANDROID_HOME/emulator/emulator" -avd nemesis -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot > /tmp/emulator.out 2>&1 &
          EMULATOR=$!
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for i in $(seq 1 90); do
            boot=$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$boot" = "1" ] && break
            sleep 4
          done
          [ "${boot:-}" = "1" ] || { tail -30 /tmp/emulator.out; fail "l'émulateur n'a pas démarré"; }
          ADB="$ANDROID_HOME/platform-tools/adb"
          echo "Émulateur prêt : $($ADB shell getprop ro.product.cpu.abi)"

          $ADB install -r "$APK" || fail "installation refusée"
          $ADB shell input keyevent KEYCODE_WAKEUP || true
          $ADB shell am start -W -n com.nemesisworkspace.app/.MainActivity | tee /tmp/start.txt
          grep -q "Status: ok" /tmp/start.txt || fail "l'application ne démarre pas"
          sleep 25

          # L'écran doit être l'accueil de l'espace, pas une page vide ni une
          # erreur : on interroge la page elle-même par le port de débogage.
          $ADB shell "run-as com.nemesisworkspace.app ls files" >/dev/null 2>&1 || true
          $ADB exec-out screencap -p > verification/ecran-emulateur.png || true
          ls -l verification/ecran-emulateur.png || true
          if $ADB shell "ps -A | grep -q com.nemesisworkspace.app"; then
            echo "::notice::L'application tourne après installation."
          else
            fail "le processus de l'application n'est pas actif"
          fi
          $ADB logcat -d -s AndroidRuntime:E chromium:E NemesisWorkspace:* > verification/logcat.txt || true
          if grep -q "FATAL EXCEPTION" verification/logcat.txt; then
            cat verification/logcat.txt
            fail "l'application a planté"
          fi
          $ADB emu kill || true
          kill $EMULATOR 2>/dev/null || true

      - name: Effacer la clé du disque
        if: always()
        run: |
          rm -f android/keystore.properties android/keystore/nemesis-release.p12
          echo "Clé retirée de la machine de construction."

      - name: Rassembler les paquets
        run: |
          set -euo pipefail
          mkdir -p release
          cp android/app/build/outputs/apk/release/*.apk release/
          cd release
          sha256sum *.apk > SHA256SUMS.txt
          {
            echo "# NemesisWorkspace ${VERSION_NAME} (${VERSION_CODE})"
            echo
            echo "| Paquet | Architecture | Taille | SHA-256 |"
            echo "| --- | --- | --- | --- |"
            for apk in *.apk; do
              abi=$(unzip -l "$apk" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
              size=$(stat -c '%s' "$apk")
              sum=$(sha256sum "$apk" | cut -d' ' -f1)
              echo "| $apk | ${abi:-universal} | $(numfmt --to=iec "$size") | \`$sum\` |"
            done
            echo
            echo "Chaque paquet est signé et aligné ; la somme SHA-256 permet de"
            echo "vérifier le fichier téléchargé."
          } > NOTES.md
          cat NOTES.md

      - name: Conserver les rapports d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: echec-rapports
          path: |
            /tmp/android-build.log
            android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 5

      - name: Rapporter l'échec
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPORT=/tmp/report.txt
          {
            echo "Échec du build Android sur \`${GITHUB_SHA::7}\`."
            echo
            [ -f /tmp/verify.log ] && { echo "**vérifications**"; echo '```'; tail -n 40 /tmp/verify.log; echo '```'; }
            for f in /tmp/android-build.log; do
              [ -f "$f" ] || continue
              echo "\`\`\`"
              # Les lignes qui expliquent l'échec, pas la pile d'appels.
              grep -E "^e: |error:|Error:|FAILURE|What went wrong|Caused by|> Task .*FAILED|Execution failed|severity|Lint found|^ *[0-9]+ +[a-z]" "$f" | tail -n 60 || true
              echo "\`\`\`"
            done
          } > "$REPORT"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat "$REPORT")" >/dev/null || echo "rapport non publié"
          cat "$REPORT"

      - name: Conserver les paquets et les vérifications
        uses: actions/upload-artifact@v4
        with:
          name: NemesisWorkspace-${{ env.VERSION_NAME }}-apk
          path: |
            release/*.apk
            release/SHA256SUMS.txt
            release/NOTES.md
            verification/
          if-no-files-found: error
          retention-days: 30

      - name: Publier la version
        if: github.event_name != 'pull_request' && (github.event.inputs.publish != 'false')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="android-v${VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.apk release/SHA256SUMS.txt release/NOTES.md --clobber
          else
            gh release create "$TAG" \
              release/*.apk release/SHA256SUMS.txt release/NOTES.md \
              --title "NemesisWorkspace ${VERSION_NAME} — Android" \
              --notes-file release/NOTES.md
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) octets"'
